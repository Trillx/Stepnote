<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Stepnote mark: a step line climbing to a click. Dark tile so it reads
       on light and dark toolbars alike. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232c38"/>
      <stop offset="1" stop-color="#141a21"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#3b4756" stroke-width="1.5"/>
  <path d="M28 94H52V70H76V46H90" fill="none" stroke="#7aa2ff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="96" cy="40" r="13" fill="#ff3d8b" stroke="#ffffff" stroke-width="5"/>
</svg>
